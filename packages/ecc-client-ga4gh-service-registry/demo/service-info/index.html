<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <style></style>
    <title>Service Registry - Service Info Component</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div id="demo" class="p-10"></div>

    <script type="module">
      import { html, render } from "lit";
      import "../../dist/components/service-info/index.js";

      // Example Service Registry API URL
      // In a real scenario, this would be the URL to a GA4GH Service Registry implementation
      const baseUrl = "http://localhost:8082/ga4gh/registry/v1";

      render(
        html`
          <h1 class="text-3xl font-bold mb-5">Service Info Component Demo</h1>
          <ecc-client-ga4gh-service-registry-service-info
            .baseUrl="${baseUrl}"
            @ecc-service-info-changed="${(e) =>
              console.log("Service info changed:", e.detail)}"
          ></ecc-client-ga4gh-service-registry-service-info>
        `,
        document.querySelector("#demo")
      );
    </script>
  </body>
</html>
