version: 2
updates:
  # Actions in the workflows are pinned to commit SHAs; this keeps the pins
  # (and their version comments) up to date, in one grouped pull request
  - package-ecosystem: github-actions
    directory: /
    # Pull request titles must be Conventional Commits (PR title check)
    commit-message:
      prefix: ci
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  # Images in the `Dockerfile`
  - package-ecosystem: docker
    directory: /
    commit-message:
      prefix: build
    labels: ["type: dependencies"]
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
