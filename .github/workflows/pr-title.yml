# Checks that pull request titles are Conventional Commits, as they become
# the commit messages on `main` (squash merges). A workflow of its own, so
# that editing a title or description reruns only this check, not CI. Its
# job `title` ("PR title") reports on every pull request and can be required
# by branch rules next to "CI passed" (skipped, so passed, for Dependabot)

name: PR title

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main]

permissions:
  pull-requests: read

jobs:

  title:
    name: PR title
    # Dependabot's titles can't be configured to pass (lowercase, at most 50
    # characters); a skipped job counts as passed for branch rules
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Configure which types are allowed (newline-delimited).
          # Default: https://github.com/commitizen/conventional-commit-types
          types: |
            fix
            feat
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # The subject must not start with an uppercase character and must
          # have at most 50 characters
          subjectPattern: ^(?![A-Z])(?=.{1,50}$).+$
          # If `subjectPattern` is configured, you can use this property to override
          # the default error message that is shown when the pattern doesn't match.
          # The variables `subject` and `title` can be used within the message.
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character & not have more than 50 characters.
