# Releases from version tags: a maintainer pushes `v<version>` on `main` (see
# "Releases" in CONTRIBUTING.md). The workflow lints, sets all released
# packages to the version, pushes `bump: v<version>` to `main`, publishes the
# packages to npm with trusted publishing (OIDC, with provenance) and creates
# a GitHub release for the tag. The trusted publishers on npmjs.com name this
# file (`release.yml`): keep the name

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:

  lint:
    name: Lint release
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          # No dependency cache in releases (cache poisoning); `package.json`
          # sets `packageManager`, which would turn on npm caching by default
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Run linters
        run: npm run lint

  # tests:
  #   name: Test checks
  #   runs-on: ubuntu-22.04

  #   steps:
  #     - name: Check out code
  #       uses: actions/checkout@v3
  #       with:
  #         fetch-depth: 2

  #     - name: Use Node.js 20.x
  #       uses: actions/setup-node@v3
  #       with:
  #         node-version: 20.x

  #     - name: Get node version
  #       id: node
  #       run: |
  #         echo "::set-output name=version::$(node -v)"

  #     - name: Get node_modules cache
  #       uses: actions/cache@v4
  #       id: node_modules
  #       with:
  #         path: |
  #           **/node_modules
  #         key: ${{ runner.os }}-node_modules-${{ hashFiles('**/package.lock') }}-${{ steps.node.outputs.version }}

  #     - name: Install dependencies
  #       run: npm ci

  #     - name: Install playwright browsers
  #       run: |
  #         sudo apt update
  #         npx playwright install --with-deps

  #     - name: Build
  #       run: npm run build

  #     - name: Run tests
  #       run: npm run test

  bump:
    name: Bump version
    runs-on: ubuntu-latest
    needs:
      - lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Remove 'v' from RELEASE_VERSION
        run: |
          echo "Original RELEASE_VERSION: $RELEASE_VERSION"
          RELEASE_VERSION=$(echo "$RELEASE_VERSION" | sed 's/^v//')
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
        shell: bash
      - name: Install SSH Client
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Git user config
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          # No dependency cache in releases, see above
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Update root package version
        run: npm version $RELEASE_VERSION --no-git-tag-version

      - name: Update all package versions
        run: |
          # Custom ignore list (includes eslint-config which we don't want to bump)
          IGNORE_PACKAGES="ecc-docs,@elixir-cloud/ro-crate,@elixir-cloud/tes,@elixir-cloud/eslint-config"

          echo "Ignore list: $IGNORE_PACKAGES"

          # Find all package.json files and update versions, excluding all node_modules directories
          find . -name "package.json" \
            -not -path "*/node_modules/*" \
            -not -path "./.git/*" \
            -not -path "./.changeset/*" \
            -not -path "./.github/*" \
            -not -path "./.husky/*" \
            -not -path "./.turbo/*" | while read package_file; do

            if [ "$package_file" != "./package.json" ]; then
              # Extract package name from package.json
              PACKAGE_NAME=$(node -e "
                try {
                  const pkg = require('$package_file');
                  console.log(pkg.name || '');
                } catch(e) {
                  console.log('');
                }
              ")

              # Check if package should be ignored
              if [ -n "$PACKAGE_NAME" ]; then
                SHOULD_IGNORE=$(echo "$IGNORE_PACKAGES" | grep -q "$PACKAGE_NAME" && echo "true" || echo "false")

                if [ "$SHOULD_IGNORE" = "false" ]; then
                  echo "Updating $PACKAGE_NAME in $package_file to version $RELEASE_VERSION"
                  # Update version in package.json
                  node -e "
                    const fs = require('fs');
                    const pkg = JSON.parse(fs.readFileSync('$package_file', 'utf8'));
                    if (!pkg.private) {
                      pkg.version = '$RELEASE_VERSION';
                      fs.writeFileSync('$package_file', JSON.stringify(pkg, null, 2) + '\n');
                    }
                  "
                else
                  echo "Skipping $PACKAGE_NAME (in ignore list)"
                fi
              fi
            fi
          done

      - name: ReInstall Dependencies
        run: |
          npm install

      - name: Commit version
        run: |
          git add .
          git commit -m "bump: v$RELEASE_VERSION"

      - name: Push changes
        uses: ad-m/github-push-action@881a6320fdb16eb5318c5054f31c218aec2b324c # v1.3.0
        with:
          ssh: true
          branch: main

  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    needs: bump
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Remove 'v' from RELEASE_VERSION
        run: |
          echo "Original RELEASE_VERSION: $RELEASE_VERSION"
          RELEASE_VERSION=$(echo "$RELEASE_VERSION" | sed 's/^v//')
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
        shell: bash

      - name: Setup Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          # No dependency cache in releases, see above
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later (Node.js 24 has it)
      - name: Check npm version
        run: |
          version="$(npm --version)"
          if ! node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1);
          ' "${version}"; then
            echo "::error::npm ${version} can't publish with trusted publishing (needs 11.5.1 or later)"
            exit 1
          fi

      # Fallback until the first release with trusted publishing has worked:
      # npm tries OIDC first and uses this token only if that fails (e.g. no
      # trusted publisher configured for a package). Then remove this step
      # and revoke the `NPM_TOKEN` secret
      - name: Configure npm token (fallback)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > ~/.npmrc
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Update internal dependencies
        run: |
          # Custom ignore list (includes eslint-config which we don't want to update dependencies for)
          IGNORE_PACKAGES="ecc-docs,@elixir-cloud/ro-crate,@elixir-cloud/tes,@elixir-cloud/eslint-config"

          echo "Ignore list: $IGNORE_PACKAGES"
          echo "Updating internal @elixir-cloud dependencies to version $RELEASE_VERSION"

          # Only process package.json files in workspace directories (apps/* and packages/*)
          for workspace_dir in apps packages; do
            if [ -d "$workspace_dir" ]; then
              find "$workspace_dir" -maxdepth 2 -name "package.json" -not -path "*/node_modules/*" | while read package_file; do
                # Extract package name from package.json
                PACKAGE_NAME=$(node -e "
                  try {
                    const pkg = require('./$package_file');
                    console.log(pkg.name || '');
                  } catch(e) {
                    console.log('');
                  }
                ")

                # Check if package should be processed (not in ignore list and starts with @elixir-cloud)
                if [ -n "$PACKAGE_NAME" ]; then
                  SHOULD_IGNORE=$(echo "$IGNORE_PACKAGES" | grep -q "$PACKAGE_NAME" && echo "true" || echo "false")
                  IS_ELIXIR_CLOUD=$(echo "$PACKAGE_NAME" | grep -q "^@elixir-cloud/" && echo "true" || echo "false")

                  if [ "$SHOULD_IGNORE" = "false" ] && [ "$IS_ELIXIR_CLOUD" = "true" ]; then
                    echo "Updating internal dependencies in $PACKAGE_NAME ($package_file)"

                    # Update dependencies, devDependencies, and peerDependencies
                    node -e "
                      const fs = require('fs');
                      const pkg = JSON.parse(fs.readFileSync('./$package_file', 'utf8'));
                      let updated = false;

                      // Function to update dependencies in a section
                      const updateDepsSection = (section, sectionName) => {
                        if (pkg[section]) {
                          Object.keys(pkg[section]).forEach(depName => {
                            if (depName.startsWith('@elixir-cloud/')) {
                              // Check if this dependency is not in ignore list
                              const ignoreList = '$IGNORE_PACKAGES'.split(',');
                              const shouldIgnoreDep = ignoreList.includes(depName);

                              if (!shouldIgnoreDep && pkg[section][depName] !== '$RELEASE_VERSION') {
                                console.log(\`  Updating \${depName} in \${sectionName}: \${pkg[section][depName]} -> $RELEASE_VERSION\`);
                                pkg[section][depName] = '$RELEASE_VERSION';
                                updated = true;
                              }
                            }
                          });
                        }
                      };

                      // Update all dependency sections
                      updateDepsSection('dependencies', 'dependencies');
                      updateDepsSection('devDependencies', 'devDependencies');
                      updateDepsSection('peerDependencies', 'peerDependencies');

                      // Write back if any updates were made
                      if (updated) {
                        fs.writeFileSync('./$package_file', JSON.stringify(pkg, null, 2) + '\n');
                      }
                    "
                  fi
                fi
              done
            fi
          done

      - name: Build Packages
        run: npm run build

      - name: Publish to npm
        run: npm run release

  # A GitHub release for the tag, with notes generated from the previous
  # version tag on (a prerelease for versions such as `2.0.0-alpha.49`).
  # Skipped if the release exists already, so that the job can be re-run
  github:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write # create the release
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" --repo "${REPOSITORY}" > /dev/null 2>&1; then
            echo "::notice::Release ${TAG} exists already"
            exit 0
          fi
          args=(--repo "${REPOSITORY}" --verify-tag --title "${TAG}" --generate-notes)
          # The version tag before this one, by version order
          previous="$(gh api --paginate "repos/${REPOSITORY}/tags" --jq '.[].name' \
            | grep -E '^v[0-9]' | sort -V \
            | awk -v tag="${TAG}" '$0 == tag { print prev; exit } { prev = $0 }')"
          if [ -n "${previous}" ]; then
            args+=(--notes-start-tag "${previous}")
          fi
          if [[ "${TAG}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${TAG}" "${args[@]}"
