# Releases from version tags (see "Releases" in the Contributing page of
# the documentation): after the version bump pull request, a maintainer
# pushes a signed `v<version>` on `dev` (tags on other branches fail).
# `prepare` checks the tag (annotated, with a signature that GitHub
# verified), the versions of the packages and of
# the citation metadata (`CITATION.cff`), that the tag is on `dev`, that CI
# passed for its commit and the curated release notes
# (`docs/releases/<version>.md`), and lints; `npm` builds the
# packages from the tag and stages them on npm with trusted publishing
# (OIDC, with provenance) once the `npm` environment is approved; `publish`
# creates the GitHub release for the tag. Staged versions become public only
# when a maintainer approves them on npmjs.com. The release's notes are the
# curated notes followed by GitHub's generated notes (shared action
# `elixir-cloud-aai/.github/actions/publish-release`).
# The workflow pushes nothing. The trusted publishers on npmjs.com name this
# file (`release.yml`) and the environment (`npm`): keep both names, or
# change them together with the trusted publishers.
#
# Outside elixir-cloud-aai/cloud-components (e.g. in a fork, for a dry run),
# `npm stage publish` runs with `--dry-run`; the GitHub release is still
# created there.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# One release at a time; never cancel a running release
concurrency:
  group: release
  cancel-in-progress: false

jobs:

  # All checks of the release; the other jobs need it. Lint code runs here,
  # never in the job with `id-token: write`, which installs the
  # dependencies again
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # read the CI runs of the release commit
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit that the tag pointed to when the run started, also in
          # later jobs, so that all jobs check, build and stage the same code
          ref: ${{ github.sha }}
          # All history and tags: for the branch check and the dist-tag
          fetch-depth: 0
          persist-credentials: false

      # Annotated (`git tag -s`), with a signature that GitHub verified; from
      # the API, not the checkout, which holds the commit
      - name: Check the tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          read -r type object < <(gh api "repos/${REPOSITORY}/git/ref/tags/${TAG}" \
            --jq '"\(.object.type) \(.object.sha)"')
          if [[ "${type}" != "tag" ]]; then
            echo "::error::Tag ${TAG} is not annotated: tag with git tag -s"
            exit 1
          fi
          read -r verified reason < <(gh api "repos/${REPOSITORY}/git/tags/${object}" \
            --jq '"\(.verification.verified) \(.verification.reason)"')
          if [[ "${verified}" != "true" ]]; then
            echo "::error::Tag ${TAG} has no signature that GitHub verified (${reason}): sign it with git tag -s and a key registered with GitHub"
            exit 1
          fi

      # The versions of the root, the released packages and `CITATION.cff`
      # (whose release date must not be in the future): Zenodo archives the
      # release with the citation metadata of the tagged commit
      - name: Check the versions
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! node scripts/release.js check "${version}"; then
            echo "::error::Version check failed for ${TAG} (see above): tag a commit with the versions of the version bump pull request"
            exit 1
          fi
          # From the git tags (see `fetch-depth`); fails without release tags
          dist_tag="$(node scripts/release.js dist-tag "${version}")"
          echo "::notice::Dist-tag for ${version}: ${dist_tag}"
          {
            echo "version=${version}"
            echo "dist-tag=${dist_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check the branch
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/dev; then
            echo "::error::The tag is not on dev"
            exit 1
          fi

      # The checks here don't run the tests: require a successful run of the
      # CI workflow for a push of the release commit to `dev`; runs for pull
      # requests test merge commits, not the commit itself. Re-runs that
      # succeeded count
      - name: Check that CI passed for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=1" \
            --jq .total_count)"
          if [[ ! "${runs}" =~ ^[0-9]+$ || "${runs}" -lt 1 ]]; then
            echo "::error::No successful run of the CI workflow (ci.yml) for a push of ${GITHUB_SHA}; once CI passed for it, re-run this workflow"
            exit 1
          fi

      # The curated notes (intro, then grouped sections; see "Releases" in
      # the Contributing page of the documentation), the tags and the
      # existing releases, before anything is published
      - name: Check the release notes
        uses: elixir-cloud-aai/.github/actions/publish-release@31f22fccc1f3c597ed7c1d1f75b2f85522155348 # v1.1.0
        with:
          notes: docs/releases/${{ steps.version.outputs.version }}.md
          commit: ${{ github.sha }}
          check-only: "true"

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          # No dependency cache in releases (cache poisoning); `package.json`
          # sets `packageManager`, which would turn on npm caching by default
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Run linters
        run: npm run lint

  # Named after the registry, as `pypi` in the Python repositories
  npm:
    name: Release packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prepare
    # Approval by a required reviewer; npm's trusted publishers name it
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DIST_TAG: ${{ needs.prepare.outputs.dist-tag }}
      # Stage for real only in the main repository
      DRY_RUN: ${{ github.repository != 'elixir-cloud-aai/cloud-components' }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          # The runner's cached Node.js 24 may bundle an npm without `stage`
          check-latest: true
          # No dependency cache in releases, see above
          package-manager-cache: false

      # `npm stage publish` needs npm 11.15.0 or later
      - name: Check npm version
        run: |
          version="$(npm --version)"
          if ! node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && minor >= 15) ? 0 : 1);
          ' "${version}"; then
            echo "::error::npm ${version} has no 'npm stage publish' (needs 11.15.0 or later)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      # Published packages depend on the exact versions of the others
      - name: Pin internal dependencies
        run: node scripts/release.js pin "${VERSION}"

      - name: Build packages
        run: npm run build

      # Staged versions aren't public until a maintainer approves them on
      # npmjs.com. Versions already on npm are skipped, so that the job can
      # be re-run; `npm view` doesn't see staged versions, so a version
      # staged by an earlier run fails to stage again with a conflict (E409)
      # and counts as staged (the same commit, as tags are immutable)
      - name: Stage packages on npm
        run: |
          args=(--provenance --tag "${DIST_TAG}")
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::Dry run outside elixir-cloud-aai/cloud-components"
            args+=(--dry-run)
          fi
          # Not `done < <(...)` below: that would hide a failure of the script
          dirs="$(node scripts/release.js packages)"
          if [ -z "${dirs}" ]; then
            echo "::error::No packages to release"
            exit 1
          fi
          log="$(mktemp)"
          staged=()
          failed=()
          while read -r dir; do
            name="$(node -p "require('./${dir}/package.json').name")"
            if output="$(npm view "${name}@${VERSION}" version 2>&1 < /dev/null)"; then
              if [ -n "${output}" ]; then
                echo "::notice::${name}@${VERSION} is on npm already"
                continue
              fi
            elif ! grep -q E404 <<< "${output}"; then
              echo "${output}"
              failed+=("${name}@${VERSION}")
              echo "::error::Could not look up ${name}@${VERSION} on npm"
              continue
            fi
            echo "::group::${name}@${VERSION}"
            if (cd "${dir}" && npm stage publish "${args[@]}" < /dev/null 2>&1) | tee "${log}" \
              && [ "${PIPESTATUS[0]}" -eq 0 ]; then
              staged+=("${name}@${VERSION}")
            elif grep -q "code E409" "${log}"; then
              echo "::warning::${name}@${VERSION} was staged earlier"
              staged+=("${name}@${VERSION} (staged earlier)")
            else
              failed+=("${name}@${VERSION}")
              echo "::error::Could not stage ${name}@${VERSION}"
            fi
            echo "::endgroup::"
          done <<< "${dirs}"
          {
            echo "## npm"
            echo
            if [ "${DRY_RUN}" = "true" ]; then
              echo "Dry run: nothing was staged; these packages would be:"
            elif [ "${#staged[@]}" -gt 0 ]; then
              echo "Staged with the dist-tag \`${DIST_TAG}\`; approve each version on npmjs.com (2FA):"
            fi
            echo
            for package in "${staged[@]}"; do
              echo "- \`${package}\`"
            done
            for package in "${failed[@]}"; do
              echo "- \`${package}\`: failed"
            done
            if [ "${#failed[@]}" -gt 0 ]; then
              echo
              echo "**Don't approve any version until all packages are staged:** the packages depend on each other's exact versions."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${#staged[@]}" -gt 0 ] && [ "${DRY_RUN}" != "true" ]; then
            echo "::notice::Staged ${#staged[@]} packages: approve them on npmjs.com"
          fi
          [ "${#failed[@]}" -eq 0 ]

  # The GitHub release of the tag, last, once the packages are staged: the
  # curated notes, then GitHub's generated notes under `## Commits` (a
  # prerelease for versions such as `2.0.0-alpha.49`). The shared action
  # creates it with `--verify-tag`; it fails if a draft of the tag exists
  # (delete it and re-run). A re-run passes without changes if a release of
  # the tag with the same curated notes, title and prerelease flag exists,
  # and fails otherwise
  publish:
    name: Publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [prepare, npm]
    permissions:
      contents: write # create the release
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create release
        uses: elixir-cloud-aai/.github/actions/publish-release@31f22fccc1f3c597ed7c1d1f75b2f85522155348 # v1.1.0
        with:
          notes: docs/releases/${{ needs.prepare.outputs.version }}.md
          commit: ${{ github.sha }}
